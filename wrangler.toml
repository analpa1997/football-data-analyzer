name = "football-data-analyzer"
type = "javascript"
account_id = ""
workers_dev = true
route = ""
zone_id = ""

[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.{js,ts,jsx,tsx,vue,css}"]

[build.upload]
format = "modules"
main = "./dist/index.html"

[env.production]
routes = [
  { pattern = "example.com", zone_name = "example.com" }
]
vars = { ENVIRONMENT = "production" }

[tool.pages]
compatibility_date = "2024-01-01"
